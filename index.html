<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Speffz cube</title>
<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
<!-- one settings dropdown, mounted by src/ui/controls.ts -->
<div id="top"></div>

<canvas id="view"></canvas>

<div id="legend">
  <div id="ref"></div>
  <div id="faces"></div>
</div>

<div id="status" class="hide">
  <span id="glyph"></span>
  <span id="say"></span>
  <span id="score"></span>
</div>

<div class="hide" id="answer"></div>

<div class="row hide" id="act">
  <button id="bGiveUp" class="hide">give up, reveal it</button>
  <button id="bNext" class="hide">next</button>
</div>

<div class="row" id="tabs">
  <button id="tab-learn" aria-selected="true">cube</button>
  <button id="tab-s2l" aria-selected="false">s&rarr;ltr</button>
  <button id="tab-l2s" aria-selected="false">ltr&rarr;s</button>
  <button id="tab-piece" aria-selected="false">piece</button>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
